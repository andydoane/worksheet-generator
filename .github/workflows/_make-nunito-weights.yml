name: Generate static Nunito fonts for PR 10b+c
on:
  push:
    branches:
      - feat/pr10bc-review-fixes-and-layout-foundations
permissions:
  contents: write
jobs:
  generate:
    if: github.repository == 'andydoane/worksheet-generator' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fontTools
        run: python -m pip install fonttools==4.60.2
      - name: Instantiate and validate fonts
        run: python scripts/generate_nunito.py
      - name: Commit font binaries to the review branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fonts/NunitoSans-600.ttf fonts/NunitoSans-750.ttf fonts/NunitoSans-900.ttf
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add actual static Nunito Sans 600 750 and 900 font instances'
          git push origin HEAD:refs/heads/feat/pr10bc-review-fixes-and-layout-foundations

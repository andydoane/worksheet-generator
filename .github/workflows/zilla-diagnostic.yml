name: Diagnose Zilla Slab PDF embedding

on:
  push:
    branches: ['fix/pr4-1-zilla-slab-pdf']

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Install fontTools
        run: python -m pip install --quiet fonttools
      - name: Prepare candidate font variants
        run: python scripts/zilla-candidates.py
      - name: Test font embedding with current pdf-lib/fontkit
        run: node scripts/zilla-test.mjs
      - name: Commit normalized complete Zilla font to feature branch
        run: |
          cp artifacts/zilla-candidates/resaved.ttf fonts/ZillaSlab-Bold-pdf.ttf
          git add fonts/ZillaSlab-Bold-pdf.ttf
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Add normalized Zilla Slab Bold font for PDF embedding" || exit 0
          git push origin HEAD:fix/pr4-1-zilla-slab-pdf
      - uses: actions/upload-artifact@v4
        with:
          name: zilla-font-candidates
          path: artifacts/zilla-candidates/

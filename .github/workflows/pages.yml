name: Check and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test booklet geometry and PDF output
        run: npm run test
      - name: Type-check and build
        run: npm run build
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
      - name: Generate sample PDFs
        run: npm run sample:pdf && npm run sample:pr6 && npm run sample:pr7 && npm run sample:pr8b && npm run sample:pr9b && npm run sample:pr10a && npm run sample:pr10bc && npm run sample:pr10d && npm run sample:pr10e && npm run sample:pr10f && npm run sample:pr10g && npm run sample:pr11a && npm run sample:pr11b && npm run sample:pr11c && npm run sample:pr11c-followup && npm run sample:pr11d && npm run sample:pr11e && npm run sample:pr11f && npm run sample:pr11g && npm run sample:connect-80 && npm run sample:pr12a && npm run sample:pr12a-followup && npm run sample:pr12b && npm run sample:pr12c && npm run sample:pr12d && npm run sample:pr13a && npm run sample:pr13b && npm run sample:pr14a && npm run sample:pr14b && npm run sample:pr14c && npm run sample:pr14d && npm run sample:pr15a && npm run sample:pr15b && npm run sample:pr15c && npm run sample:pr16a && npm run sample:pr16c
      - name: Upload sample PDF for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sample-bifold-booklet
          path: artifacts/*.pdf
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Check and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test booklet geometry and PDF output
        run: npm run test
      - name: Type-check and build
        run: npm run build
      - name: Generate sample PDFs
        run: npm run sample:pdf && npm run sample:pr6 && npm run sample:pr7 && npm run sample:pr8b && npm run sample:pr9b && npm run sample:pr10a && npm run sample:pr10bc
      - name: Upload sample PDF for review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sample-bifold-booklet
          path: artifacts/*.pdf
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

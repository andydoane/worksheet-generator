name: PR90 one-time BSB snapshot bootstrap
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - '.github/workflows/pr90-bsb-bootstrap.yml'
permissions:
  contents: write
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/pr90-local-bsb-verse-picker'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Snapshot publisher's complete official BSB text
        run: node --experimental-strip-types scripts/prepare-bsb.mjs
      - name: Commit publisher's BSB bytes for offline, reproducible builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/bible/bsb.txt public/bible/bsb.sha256
          git commit -m "chore: vendor publisher BSB corpus and SHA-256 checksum"
          git push origin "HEAD:${{ github.head_ref }}"
